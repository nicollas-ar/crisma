<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Defensores da Esperança</title><style>
*{box-sizing:border-box}body{margin:0;background:#080e22;color:#fff;font:16px system-ui,sans-serif}main{max-width:980px;margin:auto;padding:18px}h1{color:#f4cf86;text-align:center}p{text-align:center;color:#cbd5e1}canvas{width:100%;height:auto;background:linear-gradient(#101d43,#060c20);border:2px solid #6679ad;border-radius:14px;display:block;touch-action:none}button,input{padding:12px 16px;border-radius:10px;border:0;font:inherit}button{background:#f4c66b;color:#10172e;font-weight:bold;cursor:pointer;margin:4px}input{max-width:230px}#controls{text-align:center;margin:12px}#status{text-align:center;font-weight:bold;margin:12px}#overlay{position:fixed;inset:0;background:#020713d9;display:flex;align-items:center;justify-content:center;padding:15px;z-index:2}#panel{width:min(550px,100%);background:#1c294d;border:1px solid #7285b1;padding:25px;border-radius:20px;text-align:center;max-height:90vh;overflow:auto}#options button{display:block;width:100%;text-align:left;background:#dce6fa}#ranking{max-width:480px;margin:20px auto;background:#172445;border-radius:14px;padding:15px}li{padding:5px}small{color:#cbd5e1}
</style></head><body><main><h1>✦ Defensores da Esperança ✦</h1><p>Proteja o céu, responda às perguntas e avance pelo Advento!</p><div id="status">Prepare-se!</div><canvas id="game" width="900" height="510"></canvas><div id="controls"><button id="left">◀ Esquerda</button><button id="fire">● Atirar</button><button id="right">Direita ▶</button></div><p>Computador: A/D ou setas para mover, espaço para atirar. Celular: botões ou arraste o canhão.</p><section id="ranking"><h2>🏆 Ranking</h2><ol id="board"></ol></section></main><div id="overlay"><div id="panel"><h2 id="heading">Bem-vindo!</h2><div id="message">Digite seu nome para começar a jogar.</div><div id="options"></div><div id="entry"><input id="name" maxlength="32" placeholder="Seu nome"><button id="start">Começar</button></div></div></div><script>
const c=document.querySelector("#game"),ctx=c.getContext("2d"),overlay=document.querySelector("#overlay"),heading=document.querySelector("#heading"),message=document.querySelector("#message"),options=document.querySelector("#options"),entry=document.querySelector("#entry"),status=document.querySelector("#status");
let running=false,waiting=false,ended=false,ship={x:450},rocks=[],shots=[],powers=[],keys={},wave=0,score=0,spawn=0,fireCooldown=0,kills=0,shield=0,rapid=0,slow=0,invulnerable=0,last=0;
async function api(path,data){const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data||{})});const v=await r.json();if(!r.ok)throw Error(v.error||"Erro de conexão");return v}
async function ranking(){try{let r=await fetch("/api/ranking");let rows=await r.json();document.querySelector("#board").replaceChildren(...rows.map(x=>{let li=document.createElement("li");li.textContent=x.name+" — "+x.score+" pontos ("+x.waves+" ondas)";return li}))}catch(e){}}
function modal(title,body){running=false;overlay.style.display="flex";heading.textContent=title;message.textContent=body;options.replaceChildren();entry.style.display="none"}
function reset(){rocks=[];shots=[];powers=[];wave=1;score=0;kills=0;ship.x=450;shield=0;rapid=0;slow=0;invulnerable=0;spawn=0;ended=false;overlay.style.display="none";running=true;waiting=false;last=performance.now();requestAnimationFrame(frame)}
document.querySelector("#start").onclick=async()=>{try{await api("/api/start",{name:document.querySelector("#name").value});reset()}catch(e){message.textContent=e.message}};
async function end(reason){if(ended)return;ended=true;running=false;try{await api("/api/end")}catch(e){}modal("Fim de jogo",reason+" Pontuação: "+score);const b=document.createElement("button");b.textContent="Jogar novamente";b.onclick=()=>{entry.style.display="block";heading.textContent="Nova partida";message.textContent="Digite seu nome para tentar novamente.";b.remove()};options.append(b);ranking()}
async function ask(){if(waiting||ended)return;waiting=true;running=false;modal("Onda "+wave+" concluída!","Responda corretamente para continuar.");try{let q=await api("/api/question");message.textContent=q.question;q.options.forEach((o,i)=>{let b=document.createElement("button");b.textContent=String.fromCharCode(65+i)+") "+o;b.onclick=async()=>{options.querySelectorAll("button").forEach(x=>x.disabled=true);try{let a=await api("/api/answer",{choice:i});if(!a.correct){score=a.score;ended=true;modal("Resposta incorreta","Correta: "+a.answer+". Sua pontuação: "+score);let retry=document.createElement("button");retry.textContent="Recomeçar";retry.onclick=()=>{entry.style.display="block";heading.textContent="Nova partida";message.textContent="Digite seu nome.";retry.remove()};options.append(retry);ranking();return}score=a.score;wave=a.waves+1;kills=0;rocks=[];shots=[];powers=[];waiting=false;overlay.style.display="none";running=true;last=performance.now();requestAnimationFrame(frame)}catch(e){modal("Erro",e.message)}};options.append(b)})}catch(e){modal("Erro",e.message)}}
function shoot(){if(fireCooldown>0)return;shots.push({x:ship.x,y:447});fireCooldown=rapid>0?7:15}
function spawnRock(){rocks.push({x:25+Math.random()*850,y:-20,r:13+Math.random()*15,s:1.2+wave*.17+Math.random()*.8})}
function frame(t){if(!running)return;let dt=Math.min(2,(t-last)/16.7||1);last=t;ctx.clearRect(0,0,900,510);ctx.fillStyle="#fff";for(let i=0;i<35;i++){let x=(i*137)%900,y=(i*79)%450;ctx.fillRect(x,y,2,2)}
if(keys.ArrowLeft||keys.a||keys.A)ship.x-=6*dt;if(keys.ArrowRight||keys.d||keys.D)ship.x+=6*dt;ship.x=Math.max(25,Math.min(875,ship.x));if(keys[" "]||keys.fire)shoot();fireCooldown=Math.max(0,fireCooldown-dt);shield=Math.max(0,shield-dt);rapid=Math.max(0,rapid-dt);slow=Math.max(0,slow-dt);invulnerable=Math.max(0,invulnerable-dt);
spawn-=dt;if(spawn<=0){spawnRock();spawn=Math.max(15,48-wave*2)}
ctx.fillStyle=shield>0?"#66e5e0":"#f4c66b";ctx.beginPath();ctx.moveTo(ship.x,442);ctx.lineTo(ship.x-25,485);ctx.lineTo(ship.x+25,485);ctx.fill();ctx.fillStyle="#f8f8ff";ctx.fillRect(ship.x-5,430,10,32);
if(shield>0){ctx.strokeStyle="#66e5e0";ctx.lineWidth=3;ctx.beginPath();ctx.arc(ship.x,461,40,0,Math.PI*2);ctx.stroke()}
shots.forEach(s=>{s.y-=11*dt;ctx.fillStyle="#f8da72";ctx.fillRect(s.x-3,s.y,6,16)});shots=shots.filter(s=>s.y>-20);
rocks.forEach(r=>{r.y+=r.s*(slow>0?.45:1)*dt;ctx.fillStyle="#bd8069";ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.fill()});
for(let i=rocks.length-1;i>=0;i--){let r=rocks[i];for(let j=shots.length-1;j>=0;j--){let s=shots[j];if(Math.hypot(s.x-r.x,s.y-r.y)<r.r+8){rocks.splice(i,1);shots.splice(j,1);kills++;if(Math.random()<.16)powers.push({x:r.x,y:r.y,type:Math.floor(Math.random()*3)});break}}}
powers.forEach(p=>{p.y+=2*dt;ctx.fillStyle=["#5eead4","#f472b6","#93c5fd"][p.type];ctx.fillRect(p.x-12,p.y-12,24,24);if(Math.abs(p.x-ship.x)<34&&p.y>426){if(p.type===0)shield=600;if(p.type===1)rapid=600;if(p.type===2)slow=600;p.y=999}});powers=powers.filter(p=>p.y<510);
for(let i=rocks.length-1;i>=0;i--){let r=rocks[i];if(r.y>492){end("Um meteoro atingiu o solo.");return}if(Math.hypot(r.x-ship.x,r.y-461)<r.r+20){if(shield>0){rocks.splice(i,1);shield=0}else{end("Seu canhão foi atingido.");return}}}
status.textContent="Onda "+wave+" | Pontos "+score+" | Meteoros destruídos "+kills+"/ "+(6+wave*2);
if(kills>=6+wave*2){ask();return}requestAnimationFrame(frame)}
document.addEventListener("keydown",e=>{keys[e.key]=true;if([" ","ArrowLeft","ArrowRight"].includes(e.key))e.preventDefault()});document.addEventListener("keyup",e=>keys[e.key]=false);
for(const [id,key] of [["left","ArrowLeft"],["right","ArrowRight"],["fire","fire"]]){const b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[key]=true};for(const ev of ["pointerup","pointercancel","pointerleave"])b.addEventListener(ev,()=>keys[key]=false)}
c.addEventListener("pointermove",e=>{if(e.buttons){const r=c.getBoundingClientRect();ship.x=Math.max(25,Math.min(875,(e.clientX-r.left)/r.width*900))}});c.addEventListener("pointerdown",e=>{const r=c.getBoundingClientRect();ship.x=(e.clientX-r.left)/r.width*900;keys.fire=true});c.addEventListener("pointerup",()=>keys.fire=false);
ranking();
</script></body></html>
